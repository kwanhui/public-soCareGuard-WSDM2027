[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socareguard"
version = "0.1.0"
description = "On-premise guardrail proxy for commercial LLMs in Singapore social service practice: reversible pseudonymisation outbound, professional-conduct screening inbound."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Kwan Hui Lim" },
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "litellm>=1.50",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "cryptography>=42",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Spontaneous-entity sweep and (later) the outbound detectors.
detect = [
    "presidio-analyzer>=2.2.355",
    "spacy>=3.7",
    "gliner>=0.2.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/kwanhui/public-SoCareGuard-WSDM2027"
Issues = "https://github.com/kwanhui/public-SoCareGuard-WSDM2027/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
