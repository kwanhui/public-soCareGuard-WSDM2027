# Corpus v1.3 config. Append-only once results are reported against it.
#
# v1.3 is corpus v1.2 with 30 compliant drafts for the client's own care team appended (10 per
# pack): a note to the client's day activity centre or clinic (disability), to the shelter
# caseworker or the client's polyclinic doctor (domestic violence), and to the school counsellor
# or the co-case agency worker (youth offending). In v1.2 only 3 of the 90 external drafts named a
# care-team recipient, so the care-team tier of the audience gate had almost no compliant drafts
# to be tested against. Each instruction states the client's (or, for a young person, the young
# person's and the parent's) consent to the specific disclosure, asks for need-to-know content
# only (functional needs, appointments, arrangements, never a diagnosis or the history of the
# case), and fixes the "To:" line, so that the address block names the recipient. Each new draft
# comes from an existing v1.1 note, with the v1.1 compliant system prompt and layout, the same
# drafting model and temperature, and label NONE with audience care-team. The new drafts are in
# corpus/drafts/<pack>-careteam-v1.3.jsonl; the v1.1 and v1.2 notes, draft files and configs
# (configs/corpus-v1.1.yaml, configs/corpus-v1.2.yaml, frozen) are unchanged. Generated by
# `python3 -m socareguard.corpus drafts-careteam --config configs/corpus-v1.3.yaml`.
version: v1.3
base: v1.2
seed: 20260905
reference_date: 2026-09-01

generation:
  provider: openai
  model: gpt-5-mini   # chosen on a 6-note trial: 6/6 valid vs 5/6 for gpt-4.1 and gpt-4.1-mini
  temperature: 0.9  # ignored by gpt-5 models, recorded for the log
  workers: 6

drafts:
  model: gpt-4.1-mini
  temperature: 0.7

packs:
  disability: { n_notes: 100 }
  domestic-violence: { n_notes: 100 }
  youth-offending: { n_notes: 100 }

# Share of notes carrying a code-switched verbatim quote, and the language mix among them.
# Malay, Mandarin and Tamil fall back to Singlish when the client's name origin does not match.
code_switch_share: 0.2
code_switch_langs: { singlish: 0.5, malay: 0.2, mandarin: 0.2, tamil: 0.1 }

# Client name origin mix, equal share so recall-by-origin has balanced support.
name_origins: { chinese: 0.2, malay: 0.2, indian: 0.2, eurasian: 0.2, western: 0.2 }

paths:
  templates: corpus/templates
  notes: corpus/notes
  drafts: corpus/drafts

# Compliant external drafts (v1.2). A school letter is drawn from the notes with a school span and
# an employer letter from the notes with an employer span; the disability notes name no school and
# the youth notes almost never name an employer, hence the mix per pack. Notes are distinct within
# a pack; the draw is seeded by `seed` plus the pack's index in alphabetical order.
external_drafts:
  model: gpt-4.1-mini
  temperature: 0.7
  per_pack:
    disability: { referral_note: 15, employer_letter: 15 }
    domestic-violence: { referral_note: 10, school_letter: 10, employer_letter: 10 }
    youth-offending: { referral_note: 15, school_letter: 15 }
  # for `drafts-external --estimate`: gpt-4.1-mini standard-tier list prices on 2026-09-27
  price_usd_per_million: { input: 0.40, output: 1.60 }
  output_tokens_per_call_assumed: 200

# Compliant care-team drafts (v1.3). Each task draws from the notes whose text fits its recipient
# (`_CARETEAM_NEEDS` in src/socareguard/corpus/drafts.py: a day activity centre, a clinic or
# hospital, a shelter, a polyclinic or clinic, a school; any note for the co-case agency). Notes
# are distinct within a pack and may repeat a v1.2 note; the draw is seeded by `seed` + 10 plus the
# pack's index in alphabetical order.
careteam_drafts:
  model: gpt-4.1-mini
  temperature: 0.7
  per_pack:
    disability: { dac_support_note: 5, clinic_handover: 5 }
    domestic-violence: { shelter_note: 5, polyclinic_followup: 5 }
    youth-offending: { school_counsellor_note: 5, cocase_note: 5 }
  # for `drafts-careteam --estimate`: gpt-4.1-mini standard-tier list prices on 2026-09-27
  price_usd_per_million: { input: 0.40, output: 1.60 }
  output_tokens_per_call_assumed: 200
