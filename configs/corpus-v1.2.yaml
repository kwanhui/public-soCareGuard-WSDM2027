# Corpus v1.2 config. Append-only once results are reported against it.
#
# v1.2 is corpus v1.1 with 90 compliant drafts for an external reader appended (30 per pack):
# referral notes to another agency (the instruction of the v1.1 I10, I13 and I14 drafts), and
# letters to a school or an employer that stay within need-to-know, with the client's or parent's
# consent stated in the instruction. In v1.1 every compliant draft was an internal case summary,
# so the audience gate for I10 and I14 was never tested against a compliant external draft. Each
# new draft comes from an existing v1.1 note, with the v1.1 compliant system prompt and layout,
# the same drafting model and temperature, and label NONE with audience external. The new drafts
# are in corpus/drafts/<pack>-external-v1.2.jsonl; the v1.1 notes, draft files and this file's
# v1.1 counterpart (configs/corpus-v1.1.yaml, frozen) are unchanged. Generated by
# `python3 -m socareguard.corpus drafts-external --config configs/corpus-v1.2.yaml`.
version: v1.2
base: v1.1
seed: 20260905
reference_date: 2026-09-01

generation:
  provider: openai
  model: gpt-5-mini   # chosen on a 6-note trial: 6/6 valid vs 5/6 for gpt-4.1 and gpt-4.1-mini
  temperature: 0.9  # ignored by gpt-5 models, recorded for the log
  workers: 6

drafts:
  model: gpt-4.1-mini
  temperature: 0.7

packs:
  disability: { n_notes: 100 }
  domestic-violence: { n_notes: 100 }
  youth-offending: { n_notes: 100 }

# Share of notes carrying a code-switched verbatim quote, and the language mix among them.
# Malay, Mandarin and Tamil fall back to Singlish when the client's name origin does not match.
code_switch_share: 0.2
code_switch_langs: { singlish: 0.5, malay: 0.2, mandarin: 0.2, tamil: 0.1 }

# Client name origin mix, equal share so recall-by-origin has balanced support.
name_origins: { chinese: 0.2, malay: 0.2, indian: 0.2, eurasian: 0.2, western: 0.2 }

paths:
  templates: corpus/templates
  notes: corpus/notes
  drafts: corpus/drafts

# Compliant external drafts (v1.2). A school letter is drawn from the notes with a school span and
# an employer letter from the notes with an employer span; the disability notes name no school and
# the youth notes almost never name an employer, hence the mix per pack. Notes are distinct within
# a pack; the draw is seeded by `seed` plus the pack's index in alphabetical order.
external_drafts:
  model: gpt-4.1-mini
  temperature: 0.7
  per_pack:
    disability: { referral_note: 15, employer_letter: 15 }
    domestic-violence: { referral_note: 10, school_letter: 10, employer_letter: 10 }
    youth-offending: { referral_note: 15, school_letter: 15 }
  # for `drafts-external --estimate`: gpt-4.1-mini standard-tier list prices on 2026-09-27
  price_usd_per_million: { input: 0.40, output: 1.60 }
  output_tokens_per_call_assumed: 200
